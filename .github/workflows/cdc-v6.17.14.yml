name: CDC fermé Partikulier 6.17.14

on:
  push:
    branches: ["main", "fix/cdc-v6.17.14"]
    tags: ["v6.17.14"]
  pull_request:

permissions:
  contents: read

env:
  PK_VERSION: 6.17.14
  NODE_MAJOR: 22
  SEMGREP_VERSION: 1.132.0

jobs:
  static-contracts:
    name: Static contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring,xml,curl,zip,mysql,gd,intl,bcmath
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: python3 -m pip install --user --break-system-packages "semgrep==${SEMGREP_VERSION}"
      - run: echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - run: bash scripts/check.sh
      - run: bash -n scripts/*.sh
      - run: for f in scripts/*.mjs; do node --check "$f"; done
      - run: for f in scripts/*.php; do php -l "$f"; done
      - run: npx --no-install playwright install --with-deps chromium
      - run: cd vendor-artifacts && sha256sum -c --strict estatik-4.3.4.zip.sha256
      - run: unzip -p vendor-artifacts/estatik-4.3.4.zip estatik/estatik.php | grep -E -m1 'Version:[[:space:]]+4\.3\.4'
      - run: test "$(find tests/baselines-${PK_VERSION} -maxdepth 1 -type f -name '*.png' | wc -l)" -eq 30
      - run: test -s tests/baselines-${PK_VERSION}/SHA256SUMS
      - run: node -e "JSON.parse(require('fs').readFileSync('tests/routes-contract.json','utf8')); JSON.parse(require('fs').readFileSync('documentation/e2e-v' + process.env.PK_VERSION + '.json','utf8'))"
      - run: semgrep --config .semgrep/partikulier.yml --error theme

  cold-acceptance:
    name: Cold WordPress acceptance
    needs: static-contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: cd vendor-artifacts && sha256sum -c --strict estatik-4.3.4.zip.sha256
      - name: Run fresh environment and all acceptance suites
        env:
          PK_VERSION: 6.17.14
          PK_PORT: 8090
          PK_BASE: http://localhost:8090
          PK_DB_NAME: partikulier_ci_61712
          PK_DB_USER: partikulier_ci
          PK_DB_PASS: ci-only-sql-password
          PK_ADMIN_USER: ciadmin
          PK_ADMIN_PASS: ci-only-admin-password
          PK_ADMIN_EMAIL: ci@example.test
        run: bash scripts/ci-cold-acceptance.sh
      - name: Upload cold acceptance evidence
        run: tar -czf "cold-acceptance-v${PK_VERSION}.tar.gz" documentation/install-tooling.log documentation/*"v${PK_VERSION}"* tests/baselines-${PK_VERSION}
      - uses: actions/upload-artifact@v4
        with:
          name: cold-acceptance-v6.17.14
          path: cold-acceptance-v6.17.14.tar.gz
          if-no-files-found: error

  package:
    name: Reproducible package
    needs: [static-contracts, cold-acceptance]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: cold-acceptance-v6.17.14
      - run: tar -xzf cold-acceptance-v6.17.14.tar.gz
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: bash scripts/package.sh 6.17.14
      - run: sha256sum partikulier-6.17.14.zip > partikulier-6.17.14.zip.sha256
      - run: sha256sum -c partikulier-6.17.14.zip.sha256
      - run: unzip -tq partikulier-6.17.14.zip
      - run: unzip -l partikulier-6.17.14.zip | grep -q 'vendor-artifacts/estatik-4.3.4.zip.sha256'
      - run: unzip -l partikulier-6.17.14.zip | grep -q 'documentation/senior-code-review-v6.17.14.md'
      - uses: actions/upload-artifact@v4
        with:
          name: package-v6.17.14
          path: |
            partikulier-6.17.14.zip
            partikulier-6.17.14-theme.zip
            partikulier-6.17.14.zip.sha256
          if-no-files-found: error

  release:
    name: Publish release after acceptance
    needs: package
    if: github.event_name == 'push' && github.ref == 'refs/tags/v6.17.14'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: package-v6.17.14
      - name: Verify release artifact
        run: sha256sum -c partikulier-6.17.14.zip.sha256 && unzip -tq partikulier-6.17.14.zip
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create v6.17.14 partikulier-6.17.14.zip partikulier-6.17.14-theme.zip partikulier-6.17.14.zip.sha256 --title 'Partikulier v6.17.14 — acceptance froide' --notes-file documentation/release-notes-v6.17.14.md
