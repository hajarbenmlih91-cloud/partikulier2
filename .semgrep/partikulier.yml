rules:
  - id: partikulier-no-direct-automation-route-buyer
    languages: [php]
    severity: ERROR
    message: "Le module Buyer Qualification doit passer par Partikulier_Automation_Bridge::register_route()."
    patterns:
      - pattern: register_rest_route(...)
      - pattern-inside: |
          class Partikulier_Buyer_Qualification {
            ...
          }

  - id: partikulier-no-direct-automation-route-lead
    languages: [php]
    severity: ERROR
    message: "Le module Lead Retention doit passer par Partikulier_Automation_Bridge::register_route()."
    patterns:
      - pattern: register_rest_route(...)
      - pattern-inside: |
          class Partikulier_Lead_Retention {
            ...
          }

  - id: partikulier-no-direct-automation-route-approval
    languages: [php]
    severity: ERROR
    message: "Le module Listing Approval doit passer par Partikulier_Automation_Bridge::register_route()."
    patterns:
      - pattern: register_rest_route(...)
      - pattern-inside: |
          class Partikulier_Listing_Approval {
            ...
          }
